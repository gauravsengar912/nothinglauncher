<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nothing TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="dashboard">
    <header class="topbar">
      <div class="top-controls">
        <div class="season-label">FORMULA 1 <span>·</span> 2026 SEASON</div>
        <button class="header-search focusable" data-action="open-search" aria-label="Search apps"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
      </div>
      <div class="top-identity">
        <div class="clock-wrap" aria-label="Current time"><span id="clock-time">06:54</span><span id="ampm">PM</span><div id="date">---</div></div>
        <div class="weather-widget" aria-label="Greater Noida weather and air quality">
          <div class="weather-readout"><svg class="weather-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 23.5h14.2a6.1 6.1 0 0 0 .3-12.2A8.1 8.1 0 0 0 8.1 14 4.8 4.8 0 0 0 9 23.5Z"/><path d="M11 27h.1m5.4 0h.1m5.4 0h.1"/></svg><span class="weather-temp" id="weather-temp">--°C</span></div>
          <span class="weather-aqi" id="weather-aqi" aria-live="polite">AQI --</span>
          <small id="weather-location">GREATER NOIDA</small>
        </div>
      </div>
    </header>
    <section class="screen home-screen active" data-screen="home">
      <div class="home-layout">
        <div class="f1-main">
          <section class="calendar-panel f1-panel" aria-label="Next Formula One race weekend schedule">
            <header class="f1-panel-heading"><span id="next-race-title">NEXT RACE WEEKEND</span><span class="f1-season-mark" id="next-race-round">F1</span></header>
            <div class="calendar-subhead"><span>CODE</span><span>DATE</span><span>SESSION</span><span>IST</span></div>
            <div class="calendar-list" id="calendar-list"></div>
          </section>
          <section class="driver-panel f1-panel" aria-label="Complete 2026 Formula One drivers championship standings">
            <header class="f1-panel-heading"><span>DRIVERS' CHAMPIONSHIP</span><span class="standings-update" id="standings-update">LIVE DATA</span></header>
            <div class="driver-table-head"><span>POS</span><span>DRIVER</span><span>TEAM</span><span>PTS</span></div>
            <div class="driver-columns"><div class="driver-list" id="driver-standing-list-a"></div><div class="driver-list" id="driver-standing-list-b"></div></div>
          </section>
          <section class="constructor-panel f1-panel" aria-label="Complete 2026 Formula One constructors championship standings">
            <header class="f1-panel-heading"><span>CONSTRUCTORS</span><span class="standings-update">PTS</span></header>
            <div class="constructor-list" id="constructor-standings"></div>
          </section>
        </div>
      </div>
    </section>
    <section class="screen apps-screen" data-screen="apps" hidden>
      <div class="screen-heading"><h1>Apps</h1><div class="heading-actions"><button class="focusable text-action" data-action="open-add-app">ADD APP</button></div></div>
      <div class="apps-grid" id="all-apps-grid"></div>
      <div class="apps-pager"><button class="focusable pager-arrow" data-action="apps-prev" aria-label="Previous apps page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button class="focusable pager-arrow" data-action="apps-next" aria-label="Next apps page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
      <div id="apps-empty" class="apps-empty" hidden><span>NO APPS FOUND</span><button class="focusable text-action" data-action="refresh">REFRESH</button></div>
    </section>
    <section class="screen inputs-screen" data-screen="inputs" hidden>
      <div class="screen-heading"><div><h1>Inputs</h1><p class="screen-description">Choose a source to switch the TV input.</p></div><button class="focusable text-action" data-action="refresh-inputs">REFRESH SOURCES</button></div>
      <div class="input-cards" id="input-cards"></div>
    </section>
    <section class="screen settings-screen" data-screen="settings" hidden>
      <div class="screen-heading"><div><h1>Settings</h1><p class="screen-description">Make the launcher work your way.</p></div></div>
      <div class="settings-layout">
        <nav class="settings-sidebar" aria-label="Settings categories">
          <button class="settings-category focusable active" data-action="setting-category" data-value="appearance" aria-current="page"><svg class="setting-category-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.1a2 2 0 0 0 1.4-3.4 1.5 1.5 0 0 1 1.1-2.6H18a3 3 0 0 0 3-3c0-5-4-9-9-9Z"/><circle cx="7.5" cy="10" r=".8"/><circle cx="11" cy="7" r=".8"/><circle cx="15.5" cy="8.5" r=".8"/></svg><span class="setting-category-copy"><strong>Appearance</strong><small>Color, text and focus</small></span></button>
          <button class="settings-category focusable" data-action="setting-category" data-value="apps" aria-current="false"><svg class="setting-category-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="setting-category-copy"><strong>Apps</strong><small>Grid and app list</small></span></button>
          <button class="settings-category focusable" data-action="setting-category" data-value="data" aria-current="false"><svg class="setting-category-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg><span class="setting-category-copy"><strong>F1 &amp; Weather</strong><small>Units, clock and updates</small></span></button>
          <button class="settings-category focusable" data-action="setting-category" data-value="tv" aria-current="false"><svg class="setting-category-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span class="setting-category-copy"><strong>TV &amp; Inputs</strong><small>Sources and controls</small></span></button>
          <button class="settings-category focusable" data-action="setting-category" data-value="about" aria-current="false"><svg class="setting-category-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg><span class="setting-category-copy"><strong>About</strong><small>Launcher information</small></span></button>
        </nav>
        <section class="settings-detail" id="settings-detail" aria-live="polite"></section>
      </div>
    </section>
    <nav class="bottom-nav" aria-label="Launcher sections">
      <button class="nav-tab focusable active" data-view="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10.5H14v-6h-4v6H3.5z"/></svg><span>HOME</span></button>
      <button class="nav-tab focusable" data-view="apps" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>APPS</span></button>
      <button class="nav-tab focusable" data-view="inputs" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span>INPUTS</span></button>
      <button class="nav-tab focusable" data-view="settings" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.3 1-1.5 2.6-1.6-.6a8 8 0 0 1-1.5.9L16 20.7h-3l-.3-1.7a8 8 0 0 1-1.6-.6l-1.4.9-2.1-2.1.9-1.5a8 8 0 0 1-.6-1.6L6.2 14v-3l1.7-.3a8 8 0 0 1 .6-1.6l-.9-1.4 2.1-2.1 1.5.9a8 8 0 0 1 1.6-.6L13 4.2h3l.3 1.7a8 8 0 0 1 1.6.6l1.4-.9 2.1 2.1-.9 1.5a8 8 0 0 1 .6 1.6l1.7.3v3z" transform="translate(-1.5 0)"/></svg><span>SETTINGS</span></button>
    </nav>
    <div id="status" class="sr-only" aria-live="polite">READY</div>
  </main>
  <div id="overlay" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="webOSTVjs-1.2.13/webOSTV.js"></script>
  <script src="webOSTVjs-1.2.13/webOSTV-dev.js"></script>
  <script src="app-catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
